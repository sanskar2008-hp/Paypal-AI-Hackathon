services:
  - type: web
    name: paypilot-commerce-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_CURRENCY
        value: USD
      - key: GEMINI_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
    healthCheckPath: /api/health
